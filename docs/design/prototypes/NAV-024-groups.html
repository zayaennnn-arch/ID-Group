<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Байгууллага ба группууд</title>
<!--
  Groups and organisations split by system (ADR-0020): clickable wireframe (owner: business-analyst). NOT app code.
  One file, two systems; the dark prototype bar at the top switches between them (?sys=app opens the app side):
    Hamuga ID       — «Миний байгууллага»: NAV-024 (list), NAV-029 (register / verify), NAV-028 (join), NAV-026/027 (members),
                      NAV-035 (organisation mode).
    Map app         — «Группууд»: NAV-033 (family / friend / other groups, location sharing, one-time link),
                      NAV-034 (child mode). Children are read from Hamuga ID (NAV-035).
  docs/requirements/stories/
  Visual reference: Hamuga ID «Миний хүүхэд» page (screenshots in https://ictg.gitbook.io/hamuga-id/kids-guide):
    grey page, white sidebar card, list rows with status dots and «… ↗» buttons, centred empty state with a purple «+ …» button,
    consent-style modals. Brand purple sampled from the screenshots: #5F00EB.
  Everything is reached by clicking inside the page (no review toolbar). The prototype sends no email or SMS, so every
  verification code is shown under its input as «Туршилтын код».
  Organisation and person names, register numbers and codes are sample DATA, not UI strings. Test register numbers:
    5551234  — you are the director (verified at once)
    6201258  — someone else is the director (approval request)
    2034567  — already registered in Hamuga ID (join by work email or join request)
  Sole-proprietor TINs (NAV-029 E): the backend calls WS100818_taxPayerInfo with pin = the signed-in citizen's own register
  and lists the returned listTins under the field. 10203040506 and 10203040507 are yours; 99999999999 is not.
-->
<style>
  :root {
    --page:#F4F5F4; --card:#FFFFFF; --text:#111827; --text-2:#6B7280; --text-3:#9CA3AF;
    --line:#ECEDEE; --line-2:#E5E7EB; --hover:#F3F4F6; --active:#F1F2F3;
    --brand:#5F00EB; --brand-hover:#5200CC; --brand-soft:#EFE7FE; --brand-ink:#3B0A91;
    --ok:#22C55E; --ok-soft:#DCFCE7; --ok-ink:#166534;
    --bad:#EF4444; --bad-soft:#FEE2E2; --bad-ink:#991B1B;
    --wait:#F59E0B; --wait-soft:#FEF3C7; --wait-ink:#92400E;
    --info:#2563EB; --info-soft:#DBEAFE; --info-ink:#1E40AF;
    --warn-bg:#FFF7ED; --warn-ink:#C2410C;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
    --modal-shadow:0 20px 40px rgba(16,24,40,.18);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--page); color: var(--text); font: 14px/1.5 Inter, "Segoe UI", Roboto, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  svg { flex: none; }

  .topbar { height: 64px; display: flex; align-items: center; padding: 0 24px; }
  .logo { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 22px; letter-spacing: -.5px; color: #1A1A2E; }
  .logo span { background: var(--brand); color: #fff; border-radius: 6px; padding: 0 6px; font-size: 18px; line-height: 26px; }

  .layout { max-width: 1120px; margin: 0 auto; padding: 0 24px 48px; display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: 24px; align-items: start; }
  .sidebar { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 24px 12px 12px; position: sticky; top: 16px; }
  .profile { padding: 0 8px 16px; }
  .profile .ph { width: 96px; height: 96px; border-radius: 50%; background: #E9E4FB; display: grid; place-items: center; position: relative; }
  .profile .ph svg { width: 56px; height: 56px; fill: #6D5BD0; }
  .profile .cam { position: absolute; right: -2px; bottom: 2px; width: 28px; height: 28px; border-radius: 50%; background: #4B5563; border: 3px solid #fff; display: grid; place-items: center; }
  .profile .cam svg { width: 14px; height: 14px; fill: #fff; }
  .profile .name { font-weight: 700; margin-top: 12px; text-transform: uppercase; }
  .level { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-2); }
  .level svg { width: 14px; height: 14px; fill: var(--info); }
  .menu { border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 2px; }
  .menu .grp { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; display: flex; flex-direction: column; gap: 2px; }
  .menu a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: #374151; text-decoration: none; font-size: 13.5px; }
  .menu a:hover { background: var(--hover); }
  .menu a[aria-current="page"] { background: var(--active); color: var(--text); font-weight: 600; }
  .menu a svg { width: 18px; height: 18px; fill: #4B5563; }
  .menu .new { margin-left: auto; font-size: 10px; font-weight: 600; color: var(--brand); background: var(--brand-soft); padding: 1px 6px; border-radius: 6px; }

  .main { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
  .crumb { display: inline-flex; align-items: center; gap: 4px; color: var(--text-2); font-size: 13px; background: none; border: 0; padding: 0; cursor: pointer; }
  .crumb:hover { color: var(--text); }
  .crumb svg { width: 16px; height: 16px; fill: currentColor; }
  .section-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .section-head .t { flex: 1; min-width: 0; }
  .section-head h2 { font-size: 15px; font-weight: 700; margin: 0; }
  .section-head p { margin: 2px 0 0; font-size: 12.5px; color: var(--text-2); }
  .ghost { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--card); font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .ghost:hover { background: var(--hover); }
  .ghost svg { width: 14px; height: 14px; fill: currentColor; }
  .ghost.brand svg { fill: var(--brand); }
  .ghost.danger { color: var(--bad-ink); }
  .ghost.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .ghost.primary:hover { background: var(--brand-hover); }
  .ghost:disabled { opacity: .5; cursor: default; background: var(--card); }
  .btn.primary.danger { background: var(--bad); }
  .btn.primary.danger:hover { background: #DC2626; }

  .list { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .list.flat { box-shadow: none; border: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row.click { cursor: pointer; }
  .row.click:hover { background: #FAFAFB; }
  .row .body { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .row .sub { font-size: 12px; color: var(--text-2); }
  .row .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .ava { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; position: relative; flex: none; }
  .ava svg { width: 20px; height: 20px; fill: currentColor; }
  .ava.sq { border-radius: 10px; }
  .t-family { background: #FCE7F3; color: #9D174D; } .t-org { background: #EEF2FF; color: #3730A3; }
  .t-friend { background: #DCFCE7; color: #166534; } .t-other { background: #FEF3C7; color: #92400E; }
  .p1 { background: #FDE68A; color: #78350F; } .p2 { background: #BFDBFE; color: #1E3A8A; } .p3 { background: #FBCFE8; color: #831843; } .p4 { background: #DDD6FE; color: #4C1D95; } .p0 { background: #E9E4FB; color: #4C1D95; }
  .ava .dot { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.wait { background: var(--wait); }
  .pill { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
  .pill svg { width: 12px; height: 12px; fill: currentColor; }
  .pill.ok { background: var(--ok-soft); color: var(--ok-ink); }
  .pill.wait { background: var(--wait-soft); color: var(--wait-ink); }
  .pill.brand { background: var(--brand-soft); color: var(--brand-ink); }
  .pill.info { background: var(--info-soft); color: var(--info-ink); }
  .pill.grey { background: #F3F4F6; color: #374151; }

  .empty { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 40px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .empty .stack { display: flex; margin-bottom: 8px; align-items: center; }
  .empty .stack .ava { width: 44px; height: 44px; border: 3px solid #fff; margin-left: -10px; }
  .empty .stack .ava:first-child { margin-left: 0; }
  .empty .stack .ava.mid { width: 52px; height: 52px; z-index: 1; }
  .empty h3 { margin: 0; font-size: 14px; font-weight: 700; }
  .empty p { margin: 0; font-size: 12.5px; color: var(--text-2); }
  .btn { height: 40px; padding: 0 18px; border-radius: 8px; border: 1px solid transparent; font-weight: 600; font-size: 13.5px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-hover); }
  .btn.primary:disabled { background: #C4B5FD; cursor: default; }
  .btn.outline { background: #fff; border-color: var(--line-2); color: var(--text); }
  .btn.outline:hover { background: var(--hover); }
  .btn svg { width: 16px; height: 16px; fill: currentColor; }

  .note { border-radius: 10px; padding: 12px 14px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
  .note svg { width: 18px; height: 18px; fill: currentColor; margin-top: 1px; }
  .note.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .note.grey { background: #F3F4F6; color: #374151; }
  .note.bad { background: var(--bad-soft); color: var(--bad-ink); }
  .note.ok { background: var(--ok-soft); color: var(--ok-ink); }
  .note.info { background: var(--info-soft); color: var(--info-ink); }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line-2); margin-bottom: 16px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { padding: 10px 12px; color: var(--text-2); background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 600; font-size: 13.5px; white-space: nowrap; cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--brand); border-color: var(--brand); }
  .count { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; line-height: 18px; margin-left: 4px; text-align: center; }

  .scrim { position: fixed; inset: 0; background: rgba(17,24,39,.45); display: grid; place-items: center; padding: 16px; z-index: 20; }
  .modal { background: #fff; border-radius: 12px; box-shadow: var(--modal-shadow); width: 100%; max-width: 480px; max-height: calc(100vh - 32px); overflow: auto; }
  .modal-h { display: flex; align-items: center; gap: 8px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .modal-h h3 { flex: 1; margin: 0; font-size: 15px; font-weight: 700; }
  .modal-h .step { font-size: 12px; color: var(--text-2); }
  .x { width: 32px; height: 32px; border: 0; background: none; border-radius: 8px; cursor: pointer; display: grid; place-items: center; }
  .x:hover { background: var(--hover); }
  .x svg { width: 20px; height: 20px; fill: #4B5563; }
  .modal-b { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal-b .lead { margin: 0; font-weight: 600; }
  .modal-b .muted { margin: 0; color: var(--text-2); font-size: 13px; }
  .modal-f { display: flex; gap: 10px; padding: 0 20px 20px; }
  .modal-f .btn.outline { flex: 0 0 120px; }
  .modal-f .btn.primary { flex: 1; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label, .field .lbl { font-size: 12.5px; font-weight: 600; color: #374151; }
  .field input { height: 44px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 12px; background: #fff; min-width: 0; }
  .field input:focus { outline: 2px solid var(--brand); border-color: transparent; }
  .field .hint { font-size: 12px; color: var(--text-2); }
  .field.invalid input { border-color: var(--bad); }
  .field.invalid .hint { color: var(--bad-ink); }
  .inline { display: flex; gap: 8px; }
  .inline input { flex: 1; }
  .search { display: flex; align-items: center; gap: 8px; height: 44px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 12px; }
  .search:focus-within { outline: 2px solid var(--brand); border-color: transparent; }
  .search input { border: 0; outline: 0; flex: 1; height: 100%; background: none; min-width: 0; }
  .search svg { width: 18px; height: 18px; fill: var(--text-3); }
  .types { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .type { border: 1px solid var(--line-2); border-radius: 12px; padding: 14px; background: #fff; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 8px; }
  .type:hover { background: #FAFAFB; }
  .type[aria-checked="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }
  .type .t { font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .type .d { font-size: 12px; color: var(--text-2); }
  .opt { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line-2); border-radius: 10px; padding: 14px; cursor: pointer; background: #fff; text-align: left; width: 100%; }
  .opt:hover { background: #FAFAFB; }
  .opt[aria-checked="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }
  .opt .t { font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .opt .d { font-size: 12.5px; color: var(--text-2); }
  .opt .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #D1D5DB; margin-top: 2px; flex: none; }
  .opt[aria-checked="true"] .radio { border: 5px solid var(--brand); }
  .checkrow { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); cursor: pointer; }
  .checkrow:first-child { border-top: 0; }
  .checkrow input { accent-color: var(--brand); width: 18px; height: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: #F3F4F6; border-radius: 999px; padding: 4px 6px 4px 10px; font-size: 12.5px; }
  .chip button { border: 0; background: none; cursor: pointer; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; }
  .chip button svg { width: 14px; height: 14px; fill: #4B5563; }
  .otp { display: flex; gap: 8px; justify-content: space-between; }
  .otp input { width: 48px; height: 52px; text-align: center; font-size: 20px; font-weight: 600; border: 1px solid var(--line-2); border-radius: 8px; min-width: 0; }
  .otp input:focus { outline: 2px solid var(--brand); border-color: transparent; }
  .democode { border: 1px dashed #C4B5FD; background: #FAF7FF; border-radius: 10px; padding: 10px 14px; font-size: 12.5px; color: var(--brand-ink); display: flex; align-items: center; gap: 10px; }
  .democode b { font-size: 18px; letter-spacing: 4px; font-variant-numeric: tabular-nums; color: var(--brand); }
  .democode .fill { margin-left: auto; }
  .linkbtn { background: none; border: 0; color: var(--brand); font-weight: 600; cursor: pointer; padding: 0; font-size: 13px; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: #374151; }
  .check input { accent-color: var(--brand); width: 16px; height: 16px; margin-top: 2px; }
  .check a { color: var(--text); font-weight: 600; }
  ol.terms { margin: 0; padding-left: 18px; font-size: 12.5px; color: #374151; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
  .kv dt { color: var(--text-2); } .kv dd { margin: 0; font-weight: 600; }
  .subhead { font-size: 12.5px; font-weight: 600; color: var(--text-2); margin: 4px 0 8px; }
  .opt.tin { align-items: center; }
  .opt.tin .ava { width: 36px; height: 36px; font-size: 12px; }
  .testhint { font-size: 11.5px; color: var(--text-3); }
  .testhint code { background: #F3F4F6; padding: 0 4px; border-radius: 4px; color: #374151; cursor: pointer; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111827; color: #fff; border-radius: 10px; padding: 12px 16px;
    font-size: 13px; box-shadow: var(--modal-shadow); display: none; z-index: 40; max-width: calc(100% - 32px); }
  .toast.show { display: flex; align-items: center; gap: 16px; }
  .toast .undo { background: none; border: 0; color: #C4B5FD; font-weight: 700; cursor: pointer; padding: 4px 0; min-height: 32px; }

  /* Goal-gradient: named steps instead of «1/2» */
  .stepper { display: flex; gap: 6px; padding: 12px 20px 0; }
  .stepper .s { flex: 1; display: flex; flex-direction: column; gap: 6px; font-size: 11.5px; color: var(--text-3); min-width: 0; }
  .stepper .s i { height: 4px; border-radius: 2px; background: var(--line-2); display: block; }
  .stepper .s.done i, .stepper .s.on i { background: var(--brand); }
  .stepper .s.on { color: var(--brand); font-weight: 600; }
  .stepper .s.done { color: var(--text-2); }
  /* Doherty threshold: immediate feedback while the system works */
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
  /* Peak-end: a clear success moment with the next step */
  .success { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 0 4px; }
  .success .mark { width: 64px; height: 64px; border-radius: 50%; background: var(--ok-soft); color: var(--ok-ink); display: grid; place-items: center; }
  .success .mark.wait { background: var(--wait-soft); color: var(--wait-ink); }
  .success .mark svg { width: 32px; height: 32px; fill: currentColor; }
  .success h4 { margin: 0; font-size: 17px; }
  .success p { margin: 0; color: var(--text-2); font-size: 13px; }
  /* Hick / Jakob: one «⋯» menu per row instead of several buttons */
  .kebab { width: 36px; padding: 0; justify-content: center; font-size: 18px; letter-spacing: 1px; }
  .pop { position: fixed; z-index: 25; background: #fff; border-radius: 10px; box-shadow: var(--modal-shadow); padding: 6px; min-width: 190px; }
  .pop button { display: flex; width: 100%; align-items: center; gap: 8px; padding: 10px 12px; border: 0; background: none; border-radius: 8px; cursor: pointer; text-align: left; font-size: 13.5px; min-height: 40px; }
  .pop button:hover, .pop button:focus-visible { background: var(--hover); outline: none; }
  .pop button.danger { color: var(--bad-ink); }
  /* Common region: destructive settings grouped apart */
  .danger-zone { border: 1px solid #FECACA; box-shadow: none; }
  .zone-label { font-size: 12px; font-weight: 600; color: var(--bad-ink); margin: 16px 0 8px; }
  .stack-s { display: inline-flex; vertical-align: middle; margin-right: 6px; }
  .stack-s .ava { width: 22px; height: 22px; font-size: 9px; border: 2px solid #fff; margin-left: -6px; }
  .stack-s .ava:first-child { margin-left: 0; }
  .count.soft { background: var(--wait-soft); color: var(--wait-ink); margin-left: 0; font-weight: 600; padding: 0 8px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (max-width: 840px) {
    .layout { grid-template-columns: minmax(0, 1fr); padding: 0 16px 40px; }
    .layout > * { min-width: 0; }
    .topbar { padding: 0 16px; }
    .sidebar { position: static; padding: 16px 12px 8px; }
    .profile { display: flex; align-items: center; gap: 12px; }
    .profile .ph { width: 56px; height: 56px; }
    .profile .ph svg { width: 34px; height: 34px; }
    .profile .cam { display: none; }
    .profile .name { margin-top: 0; }
    .menu { flex-direction: row; overflow-x: auto; scrollbar-width: none; }
    .menu::-webkit-scrollbar { display: none; }
    .menu .grp { display: none; }
    .menu a { white-space: nowrap; }
    .section-head { flex-wrap: wrap; }
    .row { flex-wrap: wrap; }
    .row .acts { width: 100%; justify-content: flex-start; padding-left: 52px; }
    .otp { gap: 6px; }
    .otp input { width: 100%; }
  }
  @media (max-width: 420px) { .types { grid-template-columns: 1fr; } }
  /* Fitts: on phones the dialog becomes a bottom sheet, actions stay in thumb reach, targets ≥ 44 px */
  @media (max-width: 600px) {
    .scrim { place-items: end stretch; padding: 0; }
    .modal { max-width: none; border-radius: 16px 16px 0 0; max-height: 92vh; }
    .modal-f { position: sticky; bottom: 0; background: #fff; padding-top: 12px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
    .btn { min-height: 48px; }
    .ghost { height: 44px; }
    .kebab { width: 44px; }
  }
  @media (max-width: 840px) { .row .acts.keep { width: auto; padding-left: 0; } }

/* Permission rules from NAV-027 (group type × role × action). */
function can(g, action, m) {
  const r = g.role;
  if (g.status === 'pending-join') return false;
  if (action === 'invite') return g.type === 'friend' || r === 'owner' || r === 'admin';
  if (action === 'remove') {
    if (!m || m.me || m.role === 'owner') return false;
    if (r === 'owner') return true;
    return r === 'admin' && g.type !== 'friend' && m.role === 'member';
  }
  if (action === 'role') return r === 'owner' && m && !m.me && m.state !== 'invited' && m.kind !== 'child';
  return false;
}
const eligibleOwners = g => g.members.filter(m => !m.me && m.state !== 'invited' && m.kind !== 'child');
/* NAV-033 B / NAV-034: what the map app shows about each member's location. */
function locText(m, g) {
  if (m.state === 'invited') return '';
  if (m.me) return g.share && !g.hidden ? ` · Таны байршил: ${durLabel(g.share)}` : ' · Таны байршил хуваалцагдаагүй';
  if (m.kind === 'child') return ` · ${m.place} · Батерей ${m.battery}% · Одоо`;
  return m.loc ? ` · ${m.loc.dist} · ${m.loc.ago}` : ' · Байршил хуваалцаагүй';
}
function memberRow(m, i, g) {
  const dot = m.state === 'invited' ? 'wait' : 'ok';
  const pill = m.state === 'invited' ? '<span class="pill wait">Урилга хүлээгдэж буй</span>' : m.kind === 'child' ? '<span class="pill brand">Хүүхдийн горим</span>' : '';
  const hasActs = !m.me && (m.state === 'invited' ? can(g, 'remove', m) : can(g, 'role', m) || can(g, 'remove', m));
  const acts = hasActs ? `<button class="ghost kebab" data-act="m-menu" data-i="${i}" aria-haspopup="menu" aria-expanded="false" aria-label="${esc(m.name)}: үйлдлүүд">⋯</button>` : '';
  return `<div class="row"><div class="ava ${m.tone || 'p0'}">${esc(m.initials)}<span class="dot ${dot}"></span></div>
    <div class="body"><div class="name">${esc(m.name)}${m.me ? '<span class="pill grey">Та</span>' : ''}${pill}</div><div class="sub">${m.kind === 'child' ? 'Хүүхэд' : roleLabel(m.role)}${m.via && !m.me ? ' · ' + m.via : ''}${S.sys === 'app' ? locText(m, g) : ''}</div></div>
    ${acts ? `<div class="acts keep">${acts}</div>` : ''}</div>`;
}

function otpBlock(target) {
  return `<p class="muted"><b style="color:var(--text)">${esc(target)}</b> хаяг руу илгээсэн 6 оронтой кодыг оруулна уу. 6 дахь орныг бөглөхөд автоматаар шалгана. Код 10 минут хүчинтэй.</p>
    <div class="otp" role="group" aria-label="Баталгаажуулах код">${Array.from({ length: 6 }, (_, i) => `<input inputmode="numeric" autocomplete="${i ? 'off' : 'one-time-code'}" maxlength="1" aria-label="${i + 1}-р орон">`).join('')}</div>
    <div class="democode">${svg('mail', 'width:18px;height:18px;fill:currentColor')}<span>Туршилтын код:</span><b>${D.code.slice(0, 3)} ${D.code.slice(3)}</b><button class="linkbtn fill" data-act="fill-code">Бөглөх</button></div>
    <div class="note bad" id="otpErr" hidden>${I.warn}<div>Код буруу байна. Дахин оролдоно уу.</div></div>
    <div><button class="linkbtn" data-act="resend">Код дахин илгээх</button></div>`;
}
const footer = (backAct, nextLabel, nextAct, disabled = false, backLabel = 'Буцах') =>
  `<button class="btn outline" data-act="${backAct}">${backLabel}</button><button class="btn primary" id="next" data-act="${nextAct}" ${disabled ? 'disabled' : ''}>${nextLabel}</button>`;

const M = {
  type: () => modal('Групп үүсгэх', `<p class="lead">Ямар төрлийн групп үүсгэх вэ?</p>
      <div class="types" role="radiogroup">${SYS_TYPES.app.map(k => [k, TYPES[k]]).map(([k, t]) => `<button class="type" role="radio" data-act="pick-type" data-type="${k}" aria-checked="${D.type === k}">
        ${typeAva(k)}<div class="t">${t.label}</div><div class="d">${t.desc}</div></button>`).join('')}</div>
      <div class="note grey">${I.info}<div>Байгууллагын группыг Hamuga ID-д бүртгэнэ. <button class="linkbtn" data-act="sys" data-to="id">Hamuga ID нээх</button></div></div>`,
      footer('close', 'Үргэлжлүүлэх', 'type-next', !D.type, 'Болих'), [0, STEPS.simple]),

  details: () => {
    const t = TYPES[D.type];
    const kids = D.type === 'family' ? `<div class="field"><span class="lbl">Миний хүүхэд · Hamuga ID-аас</span>
        <div class="list flat">${CHILDREN.map(c => `<label class="checkrow"><input type="checkbox" data-child="${c.id}" ${D.children.includes(c.id) ? 'checked' : ''}>

          <span class="pill brand">ДАН</span></label>`).join('')}</div>

    return modal(`${t.label} групп үүсгэх`, `
      <div class="field"><label for="gname">Группын нэр</label><input id="gname" maxlength="50" value="${esc(D.name || t.defName)}" placeholder="Жишээ нь: ${t.defName || 'Сагсны баг'}"></div>
      ${kids}
      <div class="field"><label for="inv">${D.type === 'family' ? 'Насанд хүрсэн гишүүд урих' : 'Гишүүн урих'} (заавал биш)</label>
        <div class="inline"><input id="inv" placeholder="Утас эсвэл имэйл, таслалаар олныг" autocomplete="off"><button class="btn outline" data-act="add-invitee" style="flex:none">Нэмэх</button></div>
        <div class="hint" id="invHint">Enter эсвэл «Нэмэх» дарна. Hamuga ID-гүй хүнд бүртгүүлэх холбоос очно.</div>
        <div class="chips">${D.invitees.map((v, i) => `<span class="chip">${esc(v)}<button data-act="rm-invitee" data-i="${i}" aria-label="${esc(v)}-г хасах">${I.close}</button></span>`).join('')}</div></div>`,
      footer('back-type', 'Групп үүсгэх', 'create-simple'), [1, STEPS.simple]);
  },

  reg: () => {
    const f = D.found;
    let res = '';
    if (f === 'notfound') res = `<div class="note bad">${I.warn}<div>Регистр олдсонгүй. Дугаараа шалгаад дахин оролдоно уу.</div></div>`;
    else if (f === 'notmine') res = `<div class="note bad">${I.warn}<div>Энэ ТТД таны нэр дээр бүртгэлгүй байна. Хувиараа бизнес эрхлэгч зөвхөн өөрийн ТТД-ээр бүртгэнэ. Хуулийн этгээд бол 7 оронтой регистрээ оруулна уу.</div></div>`;
    else if (f && mine()) res = `<div class="note info">${I.info}<div>Та «${esc(mine().name)}» байгууллагад аль хэдийн байна.</div></div>`;
    else if (f) {
      const r = REGISTRY[D.reg];
      res = `<div class="list flat"><div class="row"><div class="ava sq t-org">${r.initials}</div><div class="body"><div class="name">${r.name}</div><div class="sub">${r.kind === 'tin' ? `Татварын ерөнхий газрын мэдээлэл · ТТД ${D.reg}` : 'Улсын бүртгэлийн мэдээлэл'}</div></div></div></div>
        <p class="lead" style="margin:0">Энэ байгууллага мөн үү?</p>` +
        (r.registered ? `<div class="note warn">${I.warn}<div>Энэ байгууллага Hamuga ID-д аль хэдийн бүртгэгдсэн байна. Та байгууллагад нь нэгдэж болно.</div></div>`
        : r.kind === 'tin' ? `<div class="note ok">${I.verified}<div>Энэ ТТД таны регистр дээр бүртгэлтэй тул шууд баталгаажна.</div></div>`
        : r.director === 'me' ? `<div class="note ok">${I.verified}<div>Та энэ байгууллагын гүйцэтгэх удирдлага тул байгууллага шууд баталгаажна.</div></div>`
        : `<div class="note info">${I.info}<div>Гүйцэтгэх удирдлага: <b>${r.directorMasked}</b>. Удирдлага ДАН-аар зөвшөөрсний дараа байгууллага баталгаажна. Удирдлага таны role-ийг (Эзэмшигч эсвэл Админ) сонгоно.</div></div>`);
    }
    const r = f === 'ok' ? REGISTRY[D.reg] : null;
    /* NAV-029 AC 14: one-tap choices from WS100818_taxPayerInfo (pin = own register), shown until a result is on screen. */
    const tins = r ? '' : `<div><div class="subhead">Эсвэл таны нэр дээрх татвар төлөгчөөс сонгоно уу</div>
      <div style="display:flex;flex-direction:column;gap:8px">${MY_TINS.map(t => { const x = REGISTRY[t]; return `<button class="opt tin" data-act="pick-tin" data-v="${t}">
        <div class="ava sq t-org">${x.initials}</div><div style="flex:1"><div class="t">${esc(x.name)}${x.registered ? '<span class="pill grey">Бүртгэгдсэн</span>' : ''}</div><div class="d">ТТД ${t} · Хувиараа бизнес эрхлэгч</div></div>${I.chev}</button>`; }).join('')}</div>
      <div class="hint" style="margin-top:6px">Татварын ерөнхий газрын мэдээллээс таны регистрээр олсон.</div></div>`;
    const next = !r ? footer('close', 'Шалгах', 'check-reg', false, 'Болих') :
      mine() ? footer('close', 'Байгууллагыг нээх', 'open-mine', false, 'Болих') :
      r.registered ? footer('close', 'Нэгдэх', 'to-join', false, 'Болих') :
      r.director === 'me' ? footer('close', 'Бүртгэх', 'register-me', false, 'Болих') : footer('close', 'Удирдлагаас зөвшөөрөл хүсэх', 'register-ask', false, 'Болих');
    return modal('Байгууллага бүртгэх', `
      <div class="field" id="regField"><label for="reg">Регистр эсвэл ТТД</label>
        <div class="inline"><input id="reg" inputmode="numeric" maxlength="20" autocomplete="off" value="${esc(D.reg)}" placeholder="Жишээ нь: 5551234"><button class="btn outline" data-act="check-reg" style="flex:none">Шалгах</button></div>
        <div class="hint">Хуулийн этгээдийн 7 оронтой регистрийг бичмэгц автоматаар шална. ТТД бичсэн бол «Шалгах»-ыг дарна.</div>
        <div class="testhint">Туршилт: <code data-act="try-reg" data-v="5551234">5551234</code> та удирдлага · <code data-act="try-reg" data-v="6201258">6201258</code> өөр удирдлага · <code data-act="try-reg" data-v="2034567">2034567</code> аль хэдийн бүртгэлтэй · <code data-act="try-reg" data-v="99999999999">99999999999</code> өөр хүний ТТД</div></div>
      ${tins}${res}`, next, [0, STEPS.org]);
  },

  join: () => {
    const r = REGISTRY[D.reg], hasDomain = (r.domains || []).length > 0;
    if (!hasDomain) D.joinMethod = 'request';
    return modal('Байгууллагад нэгдэх', `
      <div class="list flat"><div class="row"><div class="ava sq t-org">${r.initials}</div><div class="body"><div class="name">${r.name}<span class="pill info">${I.verified}Баталгаажсан</span></div><div class="sub">Hamuga ID-д бүртгэлтэй</div></div></div></div>
      <p class="lead">Байгууллагад харьяалагддагаа хэрхэн баталгаажуулах вэ?</p>
      <div role="radiogroup" style="display:flex;flex-direction:column;gap:10px">
      ${hasDomain ? `<button class="opt" role="radio" data-act="join-method" data-m="email" aria-checked="${D.joinMethod === 'email'}"><span class="radio"></span>
        <div style="flex:1"><div class="t">Ажлын имэйлээр <span class="pill brand">Санал болгох</span></div><div class="d">@${r.domains.join(', @')} имэйлдээ ирсэн кодоор шууд нэгдэнэ. Админы зөвшөөрөл хэрэггүй.</div></div></button>` : ''}
      <button class="opt" role="radio" data-act="join-method" data-m="request" aria-checked="${D.joinMethod === 'request'}"><span class="radio"></span>
        <div style="flex:1"><div class="t">Нэгдэх хүсэлт илгээх</div><div class="d">Байгууллагын админ зөвшөөрнө. Админ таны ДАН-аар баталгаажсан нэр, утасны сүүлийн 4 оронг харна.</div></div></button></div>
      ${D.joinMethod === 'email' && hasDomain ? `<div class="field" id="emailField"><label for="email">Ажлын имэйл</label>
          <input id="email" type="email" inputmode="email" placeholder="нэр@${r.domains[0]}" value="${esc(D.email)}"><div class="hint" id="emailHint">Энэ имэйл рүү 6 оронтой баталгаажуулах код илгээнэ.</div></div>`
        : `<div class="field"><label for="note">Тайлбар (заавал биш)</label><input id="note" maxlength="80" placeholder="Жишээ нь: Борлуулалтын алба" value="${esc(D.note)}"></div>`}`,
      D.joinMethod === 'email' && hasDomain ? footer('back-reg', 'Код илгээх', 'send-join-code') : footer('back-reg', 'Хүсэлт илгээх', 'send-request'), [1, STEPS.join]);
  },

  'join-otp': () => modal('Баталгаажуулах код', otpBlock(D.email), footer('back-join', 'Баталгаажуулах', 'verify-join', true), [2, STEPS.join]),

  success: () => { const s = D.success;
    return modal(s.heading, `<div class="success"><div class="mark ${s.wait ? 'wait' : ''}">${s.wait ? I.info : I.check}</div>
        <h4>${s.title}</h4><p>${s.text}</p></div>`,
      s.act === 'close' ? `<button class="btn primary" id="next" data-act="close">${s.cta}</button>`
        : `<button class="btn outline" data-act="close">Дараа</button><button class="btn primary" id="next" data-act="${s.act}">${s.cta}</button>`); },

  'invite-accept': () => { const v = S.invites.find(x => x.id === D.inviteId);
    return modal('Урилга хүлээн авах', `<p class="lead">${esc(v.name)} таныг гишүүнээр урьж байна.</p>
      <p class="muted">Хүлээн авснаар группын админ таны дараах мэдээллийг харах боломжтой болно:</p>
      <ol class="terms"><li>Овог, нэр</li><li>Бүртгэлтэй утасны дугаар</li><li>Байгууллагын имэйл (оруулсан бол)</li></ol>
      <label class="check"><input type="checkbox" id="agree" data-act="agree"> <span>Би <a href="#">Үйлчилгээний нөхцөл</a>-ийг уншиж танилцсан, зөвшөөрч байна</span></label>`,
      footer('close', 'Зөвшөөрөх', 'do-accept', true, 'Болих')); },

  invite: () => modal('Гишүүн урих', `
      <div class="field"><label for="inv2">Утасны дугаар эсвэл имэйл</label><input id="inv2" placeholder="Жишээ нь: 99112233 эсвэл нэр@mail.mn">
        <div class="hint" id="inv2Hint">${S.sys === 'id' ? 'Админы урилгыг хүлээн авсан хүн шууд баталгаажсан гишүүн болно.' : 'Hamuga ID-гүй хүнд бүртгүүлэх холбоос очно. Урилга 7 хоног хүчинтэй.'}</div></div>
      ${S.sys === 'app' ? `<div class="field"><span class="lbl">Эсвэл урилгын холбоос</span><div class="linkbox"><code>https://hamuga.mn/g/${esc(cur().id)}x7Q</code><button class="ghost" data-act="copy-link">Хуулах</button></div><div class="hint">Мессенжерээр илгээх эсвэл QR болгон харуулна.</div></div>` : ''}`,
      footer('close', 'Урилга илгээх', 'do-invite', false, 'Болих')),

  'domain-add': () => modal('Домэйн нэмэх', `
      <div class="field" id="domainField"><label for="domain">Домэйн</label><input id="domain" placeholder="жишээ нь: company.mn" autocomplete="off">
        <div class="hint" id="domainHint">Та өөрийн энэ домэйнтэй имэйлд ирсэн кодоор баталгаажуулна.</div></div>
      <div class="field"><label for="domainEmail">Таны энэ домэйнтэй имэйл</label><input id="domainEmail" placeholder="нэр@company.mn" autocomplete="off"></div>`,
      footer('close', 'Код илгээх', 'domain-send', false, 'Болих')),

  confirm: () => modal(D.confirm.title, `<p class="muted" style="color:var(--text)">${D.confirm.body}</p>`,
      `<button class="btn outline" data-act="close">Болих</button><button class="btn primary ${D.confirm.danger ? 'danger' : ''}" id="next" data-act="confirm-ok">${D.confirm.ok}</button>`),

  role: () => { const m = cur().members[D.target];
    const opt = (r, d) => `<button class="opt" role="radio" data-act="role-pick" data-r="${r}" aria-checked="${D.newRole === r}"><span class="radio"></span>
      <div style="flex:1"><div class="t">${roleLabel(r)}</div><div class="d">${d}</div></div></button>`;
    return modal('Role солих', `<p class="lead">${esc(m.name)}</p>
      <div role="radiogroup" style="display:flex;flex-direction:column;gap:10px">
        ${opt('admin', 'Гишүүн урих, хасах, нэгдэх хүсэлт шийдэх, группын мэдээлэл засах')}
        ${opt('member', 'Группт харагдана, байршлаа хуваалцана. Удирдах эрхгүй')}</div>
      <div class="note grey">${I.info}<div>Эзэмшигч болгохын тулд «Группын тохиргоо» → «Эзэмшлийг шилжүүлэх»-ийг ашиглана.</div></div>`,
      footer('close', 'Хадгалах', 'role-save', false, 'Болих')); },

  transfer: () => { const g = cur();
    return modal('Эзэмшлийг шилжүүлэх', `<p class="muted">Шинэ Эзэмшигч группыг бүрэн удирдана. Та Админ болж үлдэнэ.</p>
      <div role="radiogroup" style="display:flex;flex-direction:column;gap:10px">
      ${g.members.map((m, i) => ({ m, i })).filter(x => eligibleOwners(g).includes(x.m)).map(({ m, i }) =>
        `<button class="opt" role="radio" data-act="transfer-pick" data-i="${i}" aria-checked="${D.target === i}"><span class="radio"></span>
        <div style="flex:1"><div class="t">${esc(m.name)}</div><div class="d">${roleLabel(m.role)}${m.via && !m.me ? ' · ' + m.via : ''}</div></div></button>`).join('')}</div>`,
      footer('close', 'Шилжүүлэх', 'transfer-save', false, 'Болих')); },

  'domain-otp': () => modal('Домэйн баталгаажуулах', otpBlock(D.email), footer('close', 'Баталгаажуулах', 'domain-verify', true, 'Болих')),

  /* NAV-028 A: find a verified organisation by name or register. */
  'find-org': () => {
    const q = D.q.trim().toLowerCase();
    const hits = Object.entries(REGISTRY).filter(([k, r]) => r.registered && !r.kind && (!q || r.name.toLowerCase().includes(q) || k.includes(q)));
    return modal('Байгууллагад нэгдэх', `
      <div class="field"><label for="findq">Байгууллагын нэр эсвэл регистр</label>
        <div class="search">${I.search}<input id="findq" autocomplete="off" value="${esc(D.q)}" placeholder="Жишээ нь: Сүлд"></div>
        <div class="hint">Зөвхөн баталгаажсан байгууллагууд гарна.</div></div>
      <div class="list flat" id="findres">${hits.length ? hits.map(([k, r]) => `<div class="row click" data-act="find-pick" data-v="${k}" tabindex="0" role="button">
        <div class="ava sq t-org">${r.initials}</div><div class="body"><div class="name">${esc(r.name)}<span class="pill info">${I.verified}Баталгаажсан</span></div><div class="sub">Регистр ${k}</div></div>${I.chev}</div>`).join('')
        : '<div class="row"><div class="body sub">Олдсонгүй. Байгууллага тань бүртгэлгүй бол «Байгууллага бүртгэх»-ээр бүртгэнэ үү.</div></div>'}</div>`,
      `<button class="btn outline" data-act="close">Болих</button>`, [0, STEPS.join]);
  },

  /* NAV-035 C: choose personal or organisation mode. */
  'org-mode': () => {
    const orgs = S.groups.filter(g => g.type === 'org' && g.status === 'verified');
    const opt = (id, title, d, ava) => `<button class="opt" role="radio" data-act="set-mode" data-id="${id}" aria-checked="${(S.orgMode || '') === id}"><span class="radio"></span>
      ${ava}<div style="flex:1"><div class="t">${title}</div><div class="d">${d}</div></div></button>`;
    return modal('Горим сонгох', `<p class="muted">Сонгосон горимоор Hamuga-ийн бүх апп-д нэвтэрнэ.</p>
      <div role="radiogroup" style="display:flex;flex-direction:column;gap:10px">
        ${opt('', 'Хувийн горим', 'Байгууллагын мэдээлэл апп-уудад очихгүй', `<div class="ava p4" style="width:32px;height:32px;font-size:12px">${ME.short}</div>`)}
        ${orgs.map(g => opt(g.id, esc(g.name), `Байгууллагын нэрээр · ${roleLabel(g.role)}`, `<div class="ava sq t-org" style="width:32px;height:32px;font-size:12px">${g.initials}</div>`)).join('')}</div>
      ${orgs.length ? '' : `<div class="note grey">${I.info}<div>Баталгаажсан байгууллага алга. Байгууллагаа бүртгэсний дараа энд гарна.</div></div>`}`,
      `<button class="btn outline" data-act="close">Хаах</button>`);
  },

  /* NAV-033 B: always time-limited; «until I stop» reminds every 7 days. */
  share: () => modal('Байршил хуваалцах', `<p class="muted">«${esc(cur().name)}» группийн гишүүд таны байршлыг газрын зураг дээр харна.</p>
      <div role="radiogroup" aria-label="Хугацаа" style="display:flex;flex-direction:column;gap:8px">${DURATIONS.map(([k, l]) =>
        `<button class="opt" role="radio" data-act="dur" data-k="${k}" aria-checked="${D.dur === k}" style="padding:10px 14px"><span class="radio"></span><div style="flex:1"><div class="t">${l}</div>${k === 'on' ? '<div class="d">7 хоног тутамд «Та одоо ч хуваалцаж байна» гэж сануулна</div>' : ''}</div></button>`).join('')}</div>
      <div class="note grey">${I.info}<div>Хугацаа дуусахад автоматаар зогсоно. Байршлын түүх хадгалагдахгүй.</div></div>`,
      footer('close', 'Хуваалцаж эхлэх', 'share-start', false, 'Болих')),

/* Accessibility: remember what opened the dialog and return focus there; Tab stays inside the dialog. */
let opener = null;
function openModal(name) {
  closePop();
  if (!modalRoot.innerHTML && document.activeElement !== document.body) opener = document.activeElement;
  D.modal = name; modalRoot.innerHTML = M[name]();
  if (modalRoot.querySelector('.otp')) bindOtp();
  const f = modalRoot.querySelector('.otp input, input:not([type=checkbox]), .type[aria-checked="true"], .type, .opt[aria-checked="true"], .btn.primary:not([disabled])');
  if (f) setTimeout(() => f.isConnected && f.focus());
}
function closeModal() {
  modalRoot.innerHTML = ''; D.modal = null;
  if (opener && opener.isConnected) opener.focus(); else { const h = main.querySelector('h2, .crumb'); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); } }
  opener = null;
}

function bindOtp() {
  const boxes = [...modalRoot.querySelectorAll('.otp input')], btn = $('#next'), err = $('#otpErr');
  /* Fewer steps: the code is checked as soon as the 6th digit is entered. */
  const sync = () => { err.hidden = true; const full = boxes.map(b => b.value).join('').length === 6; btn.disabled = !full; if (full) setTimeout(() => btn.isConnected && !btn.dataset.busy && btn.click(), 120); };
  boxes.forEach((b, i) => {
    b.addEventListener('input', () => { b.value = b.value.replace(/\D/g, '').slice(0, 1); if (b.value && boxes[i + 1]) boxes[i + 1].focus(); sync(); });
    b.addEventListener('keydown', e => { if (e.key === 'Backspace' && !b.value && boxes[i - 1]) boxes[i - 1].focus(); });
    b.addEventListener('paste', e => { const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6); if (!t) return; e.preventDefault();
      boxes.forEach((x, j) => x.value = t[j] || ''); sync(); (boxes[t.length] || boxes[5]).focus(); });
  });
}
const otpValue = () => [...modalRoot.querySelectorAll('.otp input')].map(b => b.value).join('');
function otpOk() {
  if (otpValue() === D.code) return true;
  const boxes = [...modalRoot.querySelectorAll('.otp input')];
  boxes.forEach(b => b.value = ''); $('#otpErr').hidden = false; $('#next').disabled = true; boxes[0].focus();
  return false;
}
/* Wraps an OTP check with the busy state; on a wrong code the inputs reset (no dead end). */
function verifyOtp(onOk) {
  const btn = $('#next');
  busy(btn, 'Шалгаж байна', () => {
    if (otpValue() === D.code) return onOk();
    delete btn.dataset.busy; btn.innerHTML = 'Баталгаажуулах'; otpOk();
  }, 400);
}

  'do-accept': () => { const v = S.invites.find(x => x.id === D.inviteId); S.invites = S.invites.filter(x => x !== v);
    if (v.type !== 'org') {
      const g = addGroup({ type: v.type, name: v.name, role: 'member', share: null, members: [{ name: 'Тэмүүлэн БААТАР', initials: 'ТБ', role: 'owner', tone: 'p1', loc: { x: 38, y: 48, ago: '5 мин өмнө', dist: '0.8 км' } },
        { name: 'Анар ЦОГТ', initials: 'АЦ', role: 'member', tone: 'p2', loc: null }, { ...meMember('member'), via: 'Та · Урилгаар' }] });
      openGroup(g.id);
      return showSuccess({ heading: 'Амжилттай', title: `${esc(v.name)} группт нэгдлээ`, text: 'Таны байршил хуваалцагдахгүй байна. Хүсвэл хугацаатайгаар асаана уу.', cta: 'Байршил хуваалцах', act: 'success-share' });
    }
    const g = addGroup({ type: v.type, name: v.name, initials: v.initials, reg: '3301122', status: 'verified', role: 'member',
      members: [{ name: 'Оюун БААТАР', initials: 'ОБ', role: 'owner', tone: 'p3' }, { ...meMember('member'), via: 'Та · Админы урилгаар' }] });
    openGroup(g.id);
    showSuccess({ heading: 'Амжилттай', title: 'Та баталгаажсан гишүүн боллоо', text: `${esc(v.name)} · Админы урилгаар нэгдсэн`, cta: 'Группыг үзэх', act: 'close' }); },
  'decline-invite': el => { const at = S.invites.findIndex(x => x.id === el.dataset.id), v = S.invites[at]; S.invites.splice(at, 1); render();
    toast('Урилгаас татгалзлаа', () => { S.invites.splice(at, 0, v); render(); }); },

  /* Member management (NAV-026, NAV-027) */
  'm-menu': el => {
    const g = cur(), i = +el.dataset.i, m = g.members[i]; closePop();
    const items = m.state === 'invited' ? [['m-cancel', 'Урилга цуцлах', true]]
      : [can(g, 'role', m) && ['m-role', 'Role солих', false], can(g, 'remove', m) && ['m-remove', 'Группээс хасах', true]].filter(Boolean);
    const pop = document.createElement('div'); pop.className = 'pop'; pop.setAttribute('role', 'menu'); pop.dataset.for = i;
    pop.innerHTML = items.map(([a, l, d]) => `<button role="menuitem" class="${d ? 'danger' : ''}" data-act="${a}" data-i="${i}">${l}</button>`).join('');
    document.body.append(pop);
    const r = el.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
    pop.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + 'px';
    pop.style.top = (r.bottom + h + 8 > innerHeight ? r.top - h - 4 : r.bottom + 4) + 'px';
    pop.opener = el; el.setAttribute('aria-expanded', 'true'); pop.querySelector('button').focus({ preventScroll: true });
  },
  'm-cancel': el => { const g = cur(), at = +el.dataset.i, m = g.members[at]; g.members.splice(at, 1); render();
    toast(`${m.name} руу илгээсэн урилгыг цуцаллаа`, () => { g.members.splice(at, 0, m); render(); }); },
  'm-remove': el => { const g = cur(), m = g.members[+el.dataset.i];
    const extra = m.kind === 'child' ? ' Хүүхэд «Миний хүүхэд»-д холбоотой хэвээр үлдэнэ.' : '';
    confirmBox('Гишүүн хасах', `<b>${esc(m.name)}</b>-г «${esc(g.name)}» группээс хасах уу? Түүний байршил хуваалцалт энэ группт шууд зогсоно.${extra}`, 'Хасах', true,
      () => { g.members.splice(+el.dataset.i, 1); render(); toast(`${m.name} группээс хасагдлаа`); }); },
  'm-role': el => { const g = cur(); D.target = +el.dataset.i; D.newRole = g.members[D.target].role; openModal('role'); },
  'role-pick': el => { D.newRole = el.dataset.r; openModal('role'); },
  'role-save': () => { const g = cur(), m = g.members[D.target]; const changed = m.role !== D.newRole; m.role = D.newRole; closeModal(); render();
    if (changed) toast(`${m.name} одоо ${roleLabel(m.role)} боллоо`); },
  transfer: () => { const el = eligibleOwners(cur()); D.target = cur().members.indexOf(el[0]); openModal('transfer'); },
  'transfer-pick': el => { D.target = +el.dataset.i; openModal('transfer'); },
  'transfer-save': () => { const g = cur(), m = g.members[D.target];
    g.members.forEach(x => { if (x.me) x.role = 'admin'; }); m.role = 'owner'; g.role = 'admin';
    g.members.sort((a, b) => (a.role === 'owner' ? -1 : 0) - (b.role === 'owner' ? -1 : 0));
    closeModal(); render(); toast(`${m.name} Эзэмшигч боллоо. Та одоо Админ`); },
  leave: () => { const g = cur();
    if (g.role === 'owner') {
      if (eligibleOwners(g).length) return confirmBox('Группээс гарах', 'Та Эзэмшигч тул эхлээд эзэмшлээ өөр гишүүнд шилжүүлэх шаардлагатай.', 'Эзэмшил шилжүүлэх', false, () => A.transfer());
      return confirmBox('Группээс гарах', 'Таныг гарвал группт насанд хүрсэн гишүүн үлдэхгүй тул групп устгагдана.', 'Групп устгах', true, () => removeGroup(g, 'Групп устгагдлаа'));
    }
    confirmBox('Группээс гарах', `«${esc(g.name)}» группээс гарах уу? Дахин нэгдэхэд урилга эсвэл зөвшөөрөл шаардлагатай.`, 'Гарах', true, () => removeGroup(g, 'Та группээс гарлаа')); },
  'delete-group': () => { const g = cur();
    confirmBox('Групп устгах', `«${esc(g.name)}» группыг устгах уу? ${g.members.length - 1} гишүүн хасагдана.${g.type === 'org' ? ' Байгууллагын бүртгэл Hamuga ID-аас устна.' : ''} Буцаах боломжгүй.`,
      'Устгах', true, () => { if (g.type === 'org' && REGISTRY[g.reg]) REGISTRY[g.reg].registered = false; removeGroup(g, 'Групп устгагдлаа'); }); },
  'confirm-ok': () => { const run = D.confirm.run; closeModal(); run(); }
};
const cur = () => S.groups.find(g => g.id === S.groupId);
function confirmBox(title, body, ok, danger, run) { D.confirm = { title, body, ok, danger, run }; openModal('confirm'); }
function removeGroup(g, msg) { S.groups = S.groups.filter(x => x !== g); S.page = 'groups'; render(); toast(msg); }
const mine = () => S.groups.find(g => g.type === 'org' && g.reg === D.reg);
A['open-mine'] = () => { const g = mine(); closeModal(); openGroup(g.id); };

document.addEventListener('click', e => {
  const pop = $('.pop');
  if (pop && !e.target.closest('.pop')) { pop.opener && pop.opener.setAttribute('aria-expanded', 'false'); pop.remove(); if (e.target.closest('[data-act="m-menu"]') === pop.opener) return; }
  if (e.target.matches('[data-scrim]')) return closeModal();
  const el = e.target.closest('[data-act]');
  if (!el) { if (e.target.closest('.menu a, .check a')) e.preventDefault(); return; }
  if (el.tagName === 'A') e.preventDefault();
  if (el.dataset.act === 'agree') return A.agree();
  e.stopPropagation();
  if (el.closest('.pop')) { const o = $('.pop').opener; closePop(); if (o) { o.setAttribute('aria-expanded', 'false'); o.focus({ preventScroll: true }); } }
  if (el.disabled) return;
  if (A[el.dataset.act]) A[el.dataset.act](el);
});
document.addEventListener('change', e => { if (e.target.matches('[data-child]')) { const id = e.target.dataset.child; D.children = e.target.checked ? [...D.children, id] : D.children.filter(x => x !== id); } });
/* Tesler: the system checks the register as soon as 7 digits are typed. */
document.addEventListener('input', e => {
  if (e.target.id === 'findq') { D.q = e.target.value; const t = document.createElement('div'); t.innerHTML = M['find-org'](); $('#findres').replaceWith(t.querySelector('#findres')); return; }
  if (e.target.id !== 'reg') return;
  const d = e.target.value.replace(/\D/g, '');
  /* Wait for a pause so a longer TIN is not checked as a register after its 7th digit. */
  clearTimeout(D.regTimer);
  if (d.length === 7 && d !== D.autoReg) D.regTimer = setTimeout(() => { if ($('#reg') && $('#reg').value.replace(/\D/g, '') === d) { D.autoReg = d; A['check-reg'](); } }, 700);
});
document.addEventListener('keydown', e => {
  const pop = $('.pop');
  if (pop) {
    const items = [...pop.querySelectorAll('button')], k = items.indexOf(document.activeElement);
    if (e.key === 'Escape') { e.preventDefault(); const o = pop.opener; closePop(); o && (o.setAttribute('aria-expanded', 'false'), o.focus()); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); items[(k + 1) % items.length].focus(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); items[(k - 1 + items.length) % items.length].focus(); return; }
    if (e.key === 'Tab') closePop();
  }
  if (e.key === 'Escape' && D.modal) return closeModal();
  if (e.key === 'Tab' && D.modal) {
    const f = [...modalRoot.querySelectorAll('button:not([disabled]), input:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])')].filter(x => x.offsetParent !== null);
    if (f.length) { const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.row[role="button"]')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Enter' && e.target.id === 'reg') { e.preventDefault(); A['check-reg'](); return; }
  if (e.key === 'Enter' && e.target.id === 'inv') { e.preventDefault(); A['add-invitee'](); return; }
  /* Jakob: Enter in a single-line field submits the dialog's primary action. */
  if (e.key === 'Enter' && D.modal && e.target.matches('.modal input:not([type=checkbox]):not(.otp input)')) { const n = $('#next'); if (n && !n.disabled) { e.preventDefault(); n.click(); } }
});
window.addEventListener('resize', closePop);
window.addEventListener('scroll', closePop, true);

function render() {
  const app = S.sys === 'app';
  $('#protobar').innerHTML = `<span class="lbl">ПРОТОТИП · Систем:</span><div class="seg" role="group" aria-label="Систем сонгох">
      <button data-act="sys" data-to="id" aria-pressed="${!app}">Hamuga ID</button><button data-act="sys" data-to="app" aria-pressed="${app}">Газрын зургийн апп</button></div>
    <span class="why">ADR-0020: байгууллага ID-д, гэр бүл, найз, байршил апп-д</span>`;
  $('#logo').innerHTML = app ? 'hamuga<span class="app">Map</span>' : 'hamuga<span>ID</span>';
  document.title = app ? 'Группууд · Газрын зургийн апп' : 'Миний байгууллага · Hamuga ID';
  $('#layout').classList.toggle('app', app);
  side.hidden = app; mapwrap.hidden = !app;
  if (!app) {
    side.innerHTML = sidebar();
    const menu = $('.menu', side), c = $('[aria-current="page"]', side);
    if (menu.scrollWidth > menu.clientWidth) menu.scrollLeft = c.getBoundingClientRect().left - menu.getBoundingClientRect().left - 12;
  }
  main.innerHTML = S.page === 'group' && cur() ? groupPage() : groupsPage();
  if (app) mapwrap.innerHTML = mapView();
}
render();
</script>
</body>
</html>
