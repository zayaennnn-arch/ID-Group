<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Миний байгууллага</title>
<!--
  NAV-028 organisation membership: clickable wireframe in the Hamuga ID web style (owner: business-analyst). NOT app code.
  Story: docs/requirements/stories/NAV-028-org-membership-verification-code-mn.md
  Visual reference: Hamuga ID «Миний хүүхэд» page (id.khamuga.com/personal, screenshots in https://ictg.gitbook.io/hamuga-id/kids-guide):
    grey page, white sidebar card (avatar, name, «Түвшин 2», menu), section title + grey subtitle, white list rows with a
    green/red status dot and a small outlined «… ↗» button, centred empty state with a purple «+ …» button, consent-style modal
    with «Болих» (outlined) and a purple primary button. Brand purple sampled from the screenshots: #5F00EB.
  Logic (PO 2026-10-26): no code is sent to the admin. Three paths to «Баталгаажсан гишүүн»:
    1) admin invite (accept = verified), 2) work email on an org domain + OTP (automatic), 3) join request (admin approves in one tap).
  Organisation and person names are sample DATA, not UI strings.
  URL hash controls the view, e.g. #state=email&toolbar=0
  state: home | search | org | email | otp | joined | request-sent | invite | admin-requests | admin-domains
  Demo data: «ictgroup.mn» is configured for «ICT Group ХХК»; any 6-digit code except 000000 is accepted.
-->
<style>
  :root {
    --page:#F4F5F4; --card:#FFFFFF; --text:#111827; --text-2:#6B7280; --text-3:#9CA3AF;
    --line:#ECEDEE; --line-2:#E5E7EB; --hover:#F3F4F6; --active:#F1F2F3;
    --brand:#5F00EB; --brand-hover:#5200CC; --brand-soft:#EFE7FE; --brand-ink:#3B0A91;
    --ok:#22C55E; --ok-soft:#DCFCE7; --ok-ink:#166534;
    --bad:#EF4444; --bad-soft:#FEE2E2; --bad-ink:#991B1B;
    --wait:#F59E0B; --wait-soft:#FEF3C7; --wait-ink:#92400E;
    --info:#2563EB;
    --warn-bg:#FFF7ED; --warn-ink:#C2410C;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
    --modal-shadow:0 20px 40px rgba(16,24,40,.18);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--page); color: var(--text); font: 14px/1.5 Inter, "Segoe UI", Roboto, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  svg { flex: none; }

  /* review toolbar (not part of the app) */
  .toolbar { position: sticky; top: 0; z-index: 30; background: #fff; border-bottom: 1px solid var(--line-2);
    padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 12px; }
  .toolbar b { color: var(--text-2); font-weight: 600; }
  .toolbar a { padding: 3px 8px; border-radius: 6px; color: var(--brand); text-decoration: none; border: 1px solid var(--line-2); }
  .toolbar a[aria-current="true"] { background: var(--brand); color: #fff; border-color: var(--brand); }
  .toolbar .sep { width: 1px; height: 18px; background: var(--line-2); }
  .toolbar-hidden .toolbar { display: none; }

  /* top bar */
  .topbar { height: 64px; display: flex; align-items: center; padding: 0 24px; }
  .logo { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 22px; letter-spacing: -.5px; color: #1A1A2E; }
  .logo span { background: var(--brand); color: #fff; border-radius: 6px; padding: 0 6px; font-size: 18px; line-height: 26px; }

  .layout { max-width: 1120px; margin: 0 auto; padding: 0 24px 48px; display: grid; grid-template-columns: 264px 1fr; gap: 24px; align-items: start; }
  .sidebar { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 24px 12px 12px; position: sticky; top: 16px; }
  .profile { padding: 0 8px 16px; }
  .profile .ph { width: 96px; height: 96px; border-radius: 50%; background: #E9E4FB; display: grid; place-items: center; position: relative; }
  .profile .ph svg { width: 56px; height: 56px; fill: #6D5BD0; }
  .profile .cam { position: absolute; right: -2px; bottom: 2px; width: 28px; height: 28px; border-radius: 50%; background: #4B5563; border: 3px solid #fff; display: grid; place-items: center; }
  .profile .cam svg { width: 14px; height: 14px; fill: #fff; }
  .profile .name { font-weight: 700; margin-top: 12px; text-transform: uppercase; }
  .level { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-2); }
  .level svg { width: 14px; height: 14px; fill: var(--info); }
  .menu { border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 2px; }
  .menu .grp { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; display: flex; flex-direction: column; gap: 2px; }
  .menu a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: #374151; text-decoration: none; font-size: 13.5px; }
  .menu a:hover { background: var(--hover); }
  .menu a[aria-current="page"] { background: var(--active); color: var(--text); font-weight: 600; }
  .menu a svg { width: 18px; height: 18px; fill: #4B5563; }
  .menu .new { margin-left: auto; font-size: 10px; font-weight: 600; color: var(--brand); background: var(--brand-soft); padding: 1px 6px; border-radius: 6px; }

  .main { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
  .section-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .section-head .t { flex: 1; min-width: 0; }
  .section-head h2 { font-size: 15px; font-weight: 700; margin: 0; }
  .section-head p { margin: 2px 0 0; font-size: 12.5px; color: var(--text-2); }
  .ghost { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--card); font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .ghost:hover { background: var(--hover); }
  .ghost svg { width: 14px; height: 14px; fill: currentColor; }
  .ghost.brand svg { fill: var(--brand); }
  .ghost.danger { color: var(--bad-ink); }
  .ghost.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .ghost.primary:hover { background: var(--brand-hover); }
  .help-ic { width: 18px; height: 18px; fill: var(--text-3); }

  .list { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .body { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .row .sub { font-size: 12px; color: var(--text-2); }
  .row .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .ava { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; position: relative; flex: none; }
  .ava.org { border-radius: 10px; background: #EEF2FF; color: #3730A3; }
  .ava.p1 { background: #FDE68A; color: #78350F; } .ava.p2 { background: #BFDBFE; color: #1E3A8A; } .ava.p3 { background: #FBCFE8; color: #831843; } .ava.p4 { background: #DDD6FE; color: #4C1D95; }
  .ava .dot { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.wait { background: var(--wait); }
  .pill { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 3px; }
  .pill svg { width: 12px; height: 12px; fill: currentColor; }
  .pill.ok { background: var(--ok-soft); color: var(--ok-ink); }
  .pill.wait { background: var(--wait-soft); color: var(--wait-ink); }
  .pill.brand { background: var(--brand-soft); color: var(--brand-ink); }
  .pill.info { background: #DBEAFE; color: #1E40AF; }

  .empty { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 40px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .empty .stack { display: flex; margin-bottom: 8px; }
  .empty .stack .ava { width: 44px; height: 44px; border: 3px solid #fff; margin-left: -10px; }
  .empty .stack .ava:first-child { margin-left: 0; }
  .empty .stack .ava.mid { width: 52px; height: 52px; margin-top: -4px; z-index: 1; }
  .empty h3 { margin: 0; font-size: 14px; font-weight: 700; }
  .empty p { margin: 0; font-size: 12.5px; color: var(--text-2); }
  .btn { height: 40px; padding: 0 18px; border-radius: 8px; border: 1px solid transparent; font-weight: 600; font-size: 13.5px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-hover); }
  .btn.primary:disabled { background: #C4B5FD; cursor: default; }
  .btn.outline { background: #fff; border-color: var(--line-2); color: var(--text); }
  .btn.outline:hover { background: var(--hover); }
  .btn svg { width: 16px; height: 16px; fill: currentColor; }

  .note { border-radius: 10px; padding: 12px 14px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
  .note svg { width: 18px; height: 18px; fill: currentColor; margin-top: 1px; }
  .note.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .note.grey { background: #F3F4F6; color: #374151; }
  .note.bad { background: var(--bad-soft); color: var(--bad-ink); }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line-2); margin-bottom: 16px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs a { padding: 10px 12px; color: var(--text-2); text-decoration: none; font-weight: 600; font-size: 13.5px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabs a[aria-current="true"] { color: var(--brand); border-color: var(--brand); }
  .count { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; line-height: 18px; margin-left: 4px; text-align: center; }

  /* modal (same pattern as «Мэдээлэл татах зөвшөөрөл») */
  .scrim { position: fixed; inset: 0; background: rgba(17,24,39,.45); display: grid; place-items: center; padding: 16px; z-index: 20; }
  .modal { background: #fff; border-radius: 12px; box-shadow: var(--modal-shadow); width: 100%; max-width: 440px; max-height: calc(100vh - 32px); overflow: auto; }
  .modal-h { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .modal-h h3 { flex: 1; margin: 0; font-size: 15px; font-weight: 700; }
  .x { width: 32px; height: 32px; border: 0; background: none; border-radius: 8px; cursor: pointer; display: grid; place-items: center; }
  .x:hover { background: var(--hover); }
  .x svg { width: 20px; height: 20px; fill: #4B5563; }
  .modal-b { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal-b .lead { margin: 0; font-weight: 600; }
  .modal-b .muted { margin: 0; color: var(--text-2); font-size: 13px; }
  .modal-f { display: flex; gap: 10px; padding: 0 20px 20px; }
  .modal-f .btn.outline { flex: 0 0 120px; }
  .modal-f .btn.primary { flex: 1; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12.5px; font-weight: 600; color: #374151; }
  .field input { height: 44px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 12px; background: #fff; }
  .field input:focus { outline: 2px solid var(--brand); border-color: transparent; }
  .field .hint { font-size: 12px; color: var(--text-2); }
  .field.invalid input { border-color: var(--bad); }
  .field.invalid .hint { color: var(--bad-ink); }
  .search { display: flex; align-items: center; gap: 8px; height: 44px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 12px; }
  .search:focus-within { outline: 2px solid var(--brand); border-color: transparent; }
  .search input { border: 0; outline: 0; flex: 1; height: 100%; background: none; }
  .search svg { width: 18px; height: 18px; fill: var(--text-3); }
  .opt { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line-2); border-radius: 10px; padding: 14px; cursor: pointer; background: #fff; text-align: left; width: 100%; }
  .opt:hover { background: #FAFAFB; }
  .opt[aria-checked="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }
  .opt .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--brand-soft); display: grid; place-items: center; }
  .opt .ic svg { width: 18px; height: 18px; fill: var(--brand); }
  .opt .t { font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .opt .d { font-size: 12.5px; color: var(--text-2); }
  .opt .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #D1D5DB; margin-top: 2px; flex: none; }
  .opt[aria-checked="true"] .radio { border: 5px solid var(--brand); }
  .otp { display: flex; gap: 8px; justify-content: space-between; }
  .otp input { width: 48px; height: 52px; text-align: center; font-size: 20px; font-weight: 600; border: 1px solid var(--line-2); border-radius: 8px; }
  .otp input:focus { outline: 2px solid var(--brand); border-color: transparent; }
  .linkbtn { background: none; border: 0; color: var(--brand); font-weight: 600; cursor: pointer; padding: 0; font-size: 13px; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: #374151; }
  .check input { accent-color: var(--brand); width: 16px; height: 16px; margin-top: 2px; }
  .check a { color: var(--text); font-weight: 600; }
  ol.terms { margin: 0; padding-left: 18px; font-size: 12.5px; color: #374151; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111827; color: #fff; border-radius: 10px; padding: 12px 16px;
    font-size: 13px; box-shadow: var(--modal-shadow); display: none; z-index: 40; max-width: calc(100% - 32px); }
  .toast.show { display: block; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (max-width: 840px) {
    .layout { grid-template-columns: minmax(0, 1fr); padding: 0 16px 40px; }
    .layout > * { min-width: 0; }
    .otp { gap: 6px; }
    .otp input { width: 100%; min-width: 0; }
    .topbar { padding: 0 16px; }
    .sidebar { position: static; padding: 16px 12px 8px; }
    .profile { display: flex; align-items: center; gap: 12px; }
    .profile .ph { width: 56px; height: 56px; }
    .profile .ph svg { width: 34px; height: 34px; }
    .profile .cam { display: none; }
    .profile .name { margin-top: 0; }
    .menu { flex-direction: row; overflow-x: auto; scrollbar-width: none; }
    .menu::-webkit-scrollbar { display: none; }
    .section-head { flex-wrap: wrap; }
    .menu .grp { display: none; }
    .menu a { white-space: nowrap; }
    .row { flex-wrap: wrap; }
    .row .acts { width: 100%; justify-content: flex-start; padding-left: 52px; }
  }
</style>
</head>

const MODAL_FOR = { search: 'search', org: 'org', email: 'email', otp: 'otp' };

function bindOtp(root, onChange) {
  const boxes = [...root.querySelectorAll('.otp input')];
  boxes.forEach((b, i) => {
    b.addEventListener('input', () => { b.value = b.value.replace(/\D/g, '').slice(0, 1); if (b.value && boxes[i + 1]) boxes[i + 1].focus(); onChange(boxes.map(x => x.value).join('')); });
    b.addEventListener('keydown', e => { if (e.key === 'Backspace' && !b.value && boxes[i - 1]) boxes[i - 1].focus(); });
    b.addEventListener('paste', e => { const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6); if (!t) return; e.preventDefault();
      boxes.forEach((x, j) => x.value = t[j] || ''); onChange(t); (boxes[t.length] || boxes[5]).focus(); });
  });
  return boxes;
}

function openModal(name) { modalRoot.innerHTML = MODALS[name](); bindModal(name); const f = modalRoot.querySelector('input,button.opt,.btn.primary'); if (f) f.focus(); }
function closeModal() { modalRoot.innerHTML = ''; }

function bindModal(name) {
  modalRoot.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => { closeModal(); if (MODAL_FOR[view.state]) go('home'); }));
  $('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') { closeModal(); if (MODAL_FOR[view.state]) go('home'); } });
  modalRoot.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  const B = {
    search() {
      const q = $('#q'), res = $('#results');
      const draw = () => {
        const v = q.value.trim().toLowerCase();
        const list = ORGS.filter(o => !v || o.name.toLowerCase().includes(v) || o.reg.includes(v));
        res.innerHTML = list.length ? list.map(o => orgRow(o, o.domains.length ? 'Ажлын имэйлээр нэгдэх боломжтой' : 'Нэгдэх хүсэлтээр',
          `<button class="ghost" data-org="${o.id}">Сонгох ${I.arrow.replace('<svg', '<svg style="width:14px;height:14px"')}</button>`)).join('')
          : '<div class="row"><div class="body sub">Илэрц олдсонгүй</div></div>';
      };
      q.addEventListener('input', draw); draw();
      res.addEventListener('click', e => { const b = e.target.closest('[data-org]'); if (!b) return;
        state.org = ORGS.find(o => o.id === b.dataset.org); state.method = state.org.domains.length ? 'email' : 'request'; go('org'); });
    },
    org() {
      modalRoot.querySelectorAll('[data-method]').forEach(b => b.addEventListener('click', () => {
        state.note = ($('#note') || {}).value || state.note; state.method = b.dataset.method; openModal('org'); }));
      $('#next').addEventListener('click', () => {
        if (state.method === 'email') return go('email');
        state.note = $('#note').value.trim();
        state.requests.unshift({ id: Date.now(), name: 'Батбаяр ГОМБО', tone: 'p4', phone: '•••• 3310', note: state.note, when: 'Саяхан' });
        go('request-sent'); toast('Нэгдэх хүсэлт илгээгдлээ');
      });
    },
    email() {
      const inp = $('#email'), field = $('#emailField'), hint = $('#emailHint'), btn = $('#sendCode'), alt = $('#emailAlt');
      const check = () => {
        const v = inp.value.trim().toLowerCase(), m = v.match(/^[^@\s]+@([^@\s]+\.[^@\s]+)$/);
        field.classList.remove('invalid'); alt.hidden = true; hint.textContent = 'Энэ имэйл рүү 6 оронтой баталгаажуулах код илгээнэ.';
        if (!m) { btn.disabled = true; return; }
        if (!state.org.domains.includes(m[1])) { field.classList.add('invalid'); alt.hidden = false; btn.disabled = true;
          hint.textContent = 'Энэ имэйл байгууллагын домэйнд хамаарахгүй байна.'; return; }
        btn.disabled = false;
      };
      inp.addEventListener('input', check); check();
      $('#toRequest').addEventListener('click', () => { state.method = 'request'; go('org'); });
      btn.addEventListener('click', () => { state.email = inp.value.trim(); go('otp'); });
    },
    otp() {
      let code = ''; const btn = $('#verify'), err = $('#otpErr');
      const boxes = bindOtp(modalRoot, v => { code = v; err.hidden = true; btn.disabled = v.length !== 6; });
      setTimeout(() => boxes[0].isConnected && boxes[0].focus());
      btn.addEventListener('click', () => { if (code === '000000') { err.hidden = false; return; } go('joined'); toast('Та байгууллагын баталгаажсан гишүүн боллоо'); });
      $('#resend').addEventListener('click', () => { boxes.forEach(b => b.value = ''); btn.disabled = true; boxes[0].focus(); toast('Код дахин илгээлээ'); });
    },
    'invite-accept'() {
      const a = $('#agree'), b = $('#agreeBtn');
      a.addEventListener('change', () => b.disabled = !a.checked);
      b.addEventListener('click', () => { closeModal(); go('joined'); toast('Та байгууллагын баталгаажсан гишүүн боллоо'); });
    },
    'domain-add'() {
      const inp = $('#domain'), field = $('#domainField'), hint = $('#domainHint');
      $('#saveDomain').addEventListener('click', () => {
        const d = inp.value.trim().toLowerCase().replace(/^@/, '');
        const fail = msg => { field.classList.add('invalid'); hint.textContent = msg; inp.focus(); };
        if (!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(d)) return fail('Домэйн буруу байна. Жишээ нь: company.mn');
        if (PUBLIC_DOMAINS.includes(d)) return fail('Нийтийн имэйлийн домэйныг нэмэх боломжгүй.');
        if (state.domains.includes(d)) return fail('Энэ домэйн аль хэдийн нэмэгдсэн байна.');
        if (ORGS.some(o => o !== state.org && o.domains.includes(d))) return fail('Энэ домэйн өөр байгууллагад бүртгэлтэй байна.');
        const em = $('#domainEmail').value.trim() || ('batbayar@' + d);
        if (!em.toLowerCase().endsWith('@' + d)) return fail('Имэйл тань энэ домэйнтэй байх ёстой.');
        state.domainPending = { domain: d, email: em }; openModal('domain-otp');
      });
    },
    'domain-otp'() {
      const ok = $('#confirmDomain');
      bindOtp(modalRoot, v => ok.disabled = v.length !== 6);
      setTimeout(() => { const b = modalRoot.querySelector('.otp input'); if (b) b.focus(); });
      ok.addEventListener('click', () => { state.domains.push(state.domainPending.domain); state.org.domains = state.domains; state.domainPending = null; closeModal(); render(); toast('Домэйн идэвхжлээ'); });
    }
  };
  if (B[name]) B[name]();
}

function bindPage() {
  main.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { go(b.dataset.go); if (b.dataset.toast) toast(b.dataset.toast); }));
  const acc = $('#acceptInvite'); if (acc) acc.addEventListener('click', () => openModal('invite-accept'));
  const list = $('#reqList');
  if (list) list.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const id = +b.closest('[data-id]').dataset.id, r = state.requests.find(x => x.id === id);
    state.requests = state.requests.filter(x => x.id !== id); render();
    toast(b.dataset.act === 'approve' ? `${r.name} баталгаажсан гишүүн боллоо` : `${r.name}-ийн хүсэлтийг татгалзлаа`);
  });
  const all = $('#approveAll'); if (all) all.addEventListener('click', () => { const n = state.requests.length; state.requests = []; render(); toast(`${n} хүсэлтийг зөвшөөрлөө`); });
  const add = $('#addDomain'); if (add) add.addEventListener('click', () => openModal('domain-add'));
  main.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => {
    state.domains = state.domains.filter(d => d !== b.dataset.remove); state.org.domains = state.domains; render(); toast('Домэйн хасагдлаа. Өмнө нэгдсэн гишүүд үлдэнэ.'); }));
}

function render() {
  const s = view.state;
  document.body.classList.toggle('toolbar-hidden', !view.toolbar);
  document.querySelectorAll('.toolbar a[href^="#state="]').forEach(a => a.setAttribute('aria-current', a.getAttribute('href') === '#state=' + s ? 'true' : 'false'));
  side.innerHTML = sidebar(s);
  const menu = $('.menu', side), cur = $('[aria-current="page"]', side);
  if (menu.scrollWidth > menu.clientWidth) menu.scrollLeft = cur.getBoundingClientRect().left - menu.getBoundingClientRect().left - 12;
  const base = MODAL_FOR[s] ? 'home' : s;
  main.innerHTML = isAdmin(base) ? adminPage(base) : employeePage(base);
  bindPage();
  if (MODAL_FOR[s]) openModal(MODAL_FOR[s]); else closeModal();
}
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#state="]'); if (a) { e.preventDefault(); go(a.getAttribute('href').slice(7)); return; }
  const m = e.target.closest('.menu a'); if (m) e.preventDefault();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalRoot.innerHTML) { closeModal(); if (MODAL_FOR[view.state]) go('home'); } });
window.addEventListener('hashchange', () => {
  const p = new URLSearchParams(location.hash.slice(1));
  view.state = p.get('state') || 'home'; view.toolbar = p.get('toolbar') !== '0'; render();
});
render();
</script>
</body>
</html>
